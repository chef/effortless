# Integration Test Pipeline: scaffolding-chef-infra
#
# PURPOSE:
#   This pipeline validates the PUBLISHED chef/scaffolding-chef-infra package
#   (just promoted to unstable by the habitat/build pipeline) against the
#   LATEST chef/chef-infra-client from unstable. It catches integration issues
#   before packages are promoted to base-2025 for release.
#
#   This is distinct from the verify pipeline (verify.scaffolding-chef-infra.yml)
#   which tests scaffolding built FROM SOURCE on every PR using a fake 'ci' origin.
#   This pipeline tests packages exactly as end users will consume them from Builder.
#
# TRIGGER:
#   Triggered by the buildkite_hab_build_group_published workload subscription
#   in .expeditor/config.yml after the habitat/build pipeline successfully
#   publishes scaffolding packages to the unstable channel on Builder.
#
# CHANNEL STRATEGY:
#   chef/scaffolding-chef-infra  ->  latest from unstable (just published)
#   chef/chef-infra-client       ->  latest from unstable
#   core/* and all other deps    ->  base-2025 (stable)
#
#   See bin/ci/integration-test.sh and bin/ci/integration-test.ps1 for the
#   full channel strategy explanation and pre-install mechanism details.
#
# WHY REAL PLATFORMS, NOT DOCKER:
#   scaffolding-chef-infra ships platform-specific packages for x86_64-linux,
#   aarch64-linux, and x86_64-windows. Testing loads each package as a real
#   Habitat service via `hab sup run` + `hab svc load`, which exercises
#   supervisor process/network/service-directory behavior that does not
#   reliably reproduce inside (nested or emulated) Docker containers.
#   Running one architecture from a container on a different host architecture
#   also does not actually validate that architecture. Each step below runs
#   directly on a real machine of its target architecture:
#     - Linux x86_64:  Expeditor's native `linux` executor (real, single-use VM)
#     - Linux aarch64: bare-metal ARM Buildkite queue (real ARM host)
#     - Windows x86_64: Expeditor's native `windows` executor (real, single-use VM)
#
expeditor:
  defaults:
    buildkite:
      timeout_in_minutes: 90
      retry:
        automatic:
          limit: 1

steps:
  - label: "[integration] :linux: x86_64 :habicat: scaffolding-chef-infra + chef-infra-client (Chef 19)"
    command:
      - bin/ci/integration-test.sh scaffolding-chef-infra user-linux-chef19 ci x86_64-linux
    expeditor:
      executor:
        linux:
          privileged: true
          single-use: true

  - label: "[integration] :linux: aarch64 :habicat: scaffolding-chef-infra + chef-infra-client (Chef 19)"
    command:
      - bin/ci/integration-test.sh scaffolding-chef-infra user-linux-chef19 ci aarch64-linux
    agents:
      queue: default-privileged-aarch64

  - label: "[integration] :windows: x86_64 :habicat: scaffolding-chef-infra + chef-infra-client (Chef 19)"
    env:
      HAB_LICENSE: "accept-no-persist"
      HAB_STUDIO_SECRET_HAB_LICENSE: "accept-no-persist"
      HAB_BLDR_CHANNEL: "base-2025"
      HAB_STUDIO_SECRET_HAB_BLDR_CHANNEL: "base-2025"
    command:
      - ./bin/ci/integration-test.ps1 scaffolding-chef-infra user-windows-chef19
    expeditor:
      # The Windows executor may not have the aws CLI available (unlike the
      # Linux/aarch64 machines, where integration-test.sh's AWS SSM lookup
      # already works). Inject HAB_AUTH_TOKEN directly from Vault instead.
      secrets:
        HAB_AUTH_TOKEN:
          path: account/static/habitat/chef-ci
          field: auth_token
      executor:
        windows:
          privileged: true
          single-use: true
          shell: [ "powershell", "-Command" ]
